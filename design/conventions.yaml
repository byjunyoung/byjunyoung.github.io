# conventions.yaml — the rules one team writes for itself.
# Every value here is an example, not a default. A key left null or empty
# switches that check off rather than firing on a file that does things differently.

meta:
  language: ko # 뷰어 말 — 화면 속 문구는 번역하지 않는다

naming:
  screen_pattern: '^[\p{L}\p{N}-]+$' # letters and digits in any script, plus '-'. No '.', because flow targets are split on the last '.'
  section_pattern: '^\d{2}\. .+ - .+$'
  frame_pattern: null # import figma: how a frame name splits into screen and state; default '^(.+)-([^-\s]+)$'
  scaffold_patterns: null # import figma: frames to skip; null = ['^\[label\] ', '^\[state\] ', ' --> ', ' ~ ']

pages:
  exclude_sections: [] # import figma: sections to skip, e.g. ['^Archived$', '^\[?[Aa]rchive']

platforms:
  # what a screen is drawn as; a screen says `platform:`, else `default`
  default: web
  web: { width: 1168, frame: none } # --max 1120 + --pad 24 × 2 — 데스크톱에서 보이는 본문 폭 그대로
  ios: { width: 390, height: 844, frame: phone }
  android: { width: 412, height: 915, frame: phone }
  tablet: { width: 1024, height: 768, frame: tablet }

flows:
  # the words a flow may use; lint warns on anything else
  gestures: [ tap, swipe-left, swipe-right, swipe-down, swipe-up, long-press, back, pull ]
  navs: [ push, modal, sheet, tab, replace, dismiss ]

states:
  known: [ Default, Empty, Loading, Error, Validation, Selected, Resources ]
  required:
    # per screen type; a type with no row gets no check
    # 정적 사이트라 불러오기·오류 상태가 없다 — 목록 페이지는 type: gallery 로 두어 검사를 받지 않는다
    list: [ Default, Empty, Loading, Error ]
    form: [ Default, Validation ]
    search: [ Default, Empty ]

# kinds are files: components/<kind>.yaml (props, slots, token bindings, and for a compound part its
# elements). A `kinds:` block here is still read, as legacy, and L23 asks to move it (doan migrate kinds).

render:
  base: none # what mapped kinds are drawn with: none (self-built) | antd | … (see `doan bases`)
  components: ./components/kinds.js # self-built: a module exporting `kinds`, e.g. ./components/kinds.js (init copies the bundled set there)
  fonts: https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css # 사이트와 같은 CDN

breakpoints:
  # named widths a screen may adapt to. A screen that has a `breakpoints:` block is drawn at
  # each of these, its patches for that name applied last; a screen without one keeps its platform width
  # 사이트 미디어 쿼리: 720 이하에서 그리드·본문 반폭이 한 열로, 860 이하에서 상세 머리가 한 열로
  mobile: 390

layout:
  containers: [ stack, grid, columns ]
  spacing_tokens: 'space.' # prefix: only names starting with this may appear in gap/padding
  size_classes: [ sm, md, lg, full ]

tokens:
  # the files under tokens/ that hold primitives — palette and scale a screen must never name
  # directly (L19). File stems: primitive.tokens.json → primitive. null switches the check off.
  primitive: [ primitive ]

refs:
  required: [] # example: [prd]
  schemes: [ notion, github, figma, file, https ]

lifecycle:
  canonical_branch: main
  handoff_requires: [ 'lint:blocking=0' ]

edit:
  auto_apply: [ text ]
