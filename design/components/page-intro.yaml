kind: page-intro
description: "목록 페이지 머리 — 가운데 대문자 라벨과 회색 소개 한 단락"
anatomy: { label: "페이지 이름 — h1", text: "소개 — 한/영 따로" }
maps_to:
  code: { import: src/styles/global.css, name: ".label + .intro" }
