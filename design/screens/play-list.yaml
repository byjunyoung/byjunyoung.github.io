schema: doan/0.2
id: scr_PLAYLIST
screen: play-list
section: "05. Play - List"
type: gallery
refs:
  code: file:../src/components/pages/Playground.astro

elements:
  - { id: header, kind: site-header, lang: KR }
  - id: intro
    kind: page-intro
    label: PLAY
    text: 회사 일 밖에서 재미로 만드는 것들입니다. 풋살 팀 웹앱, 디자인·기획 일을 돕는 AI 도구, 그리고 손에 쥐는 하드웨어 프로토타입.
  - id: grid
    kind: group
    children:
      - { id: textrip, kind: entry-card, title: textrip, line: 2026 · 시제품 제작 중, sub: 쥐고 굴리는 전자책 리더 }
      - { id: weekly-fc, kind: entry-card, title: WEEKLY FC, line: 2026 · 운영 중, sub: 매주 토요일 모이는 풋살 팀의 웹 포털 }
      - { id: fig-pm, kind: entry-card, title: fig · pm, line: 2026 · 공개·사용 중, sub: 디자인·기획 일을 위한 Claude Code 플러그인 }
      - { id: doan, kind: entry-card, title: doan, line: 2026 · npm 공개 (0.2.0), sub: "화면을 파일로 두고, 에이전트가 그리는 디자인 도구" }
  - { id: footer, kind: site-footer }

layout:
  root: { kind: stack, direction: column, align: stretch, gap: space.lg, padding: space.lg }
  grid: { kind: grid, justify: start, columns: 2, gap: space.lg }

breakpoints:
  mobile:
    - { target: grid, layout: { kind: grid, columns: 1, gap: space.lg } }

flows:
  - { from: textrip, to: play-detail, gesture: tap, nav: push }

notes:
  - 카드는 샘플 넷이다. 실제는 src/content/playground 전부(지금 5개). 연도 · 상태.
  - 커버가 없는 항목은 검정 타이틀 카드(surface.title-card)로 그린다 — 지금은 부품에 변형이 없어 적지 못함.
