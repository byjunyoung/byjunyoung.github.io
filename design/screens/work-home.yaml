schema: doan/0.2
id: scr_WORKHOME
screen: work-home
section: "01. Work - Home"
type: gallery                    # 정적 목록 — 불러오기·빈 상태가 없어 list 검사를 받지 않는다
refs:
  code: file:../src/components/pages/Home.astro

elements:
  - { id: header, kind: site-header, lang: KR }
  - id: intro
    kind: page-intro
    label: WORK
    text: 하드웨어 UX 디자이너. 화면 밖에 있는 제품의 경험, 형태·촉각·공간·피드백을 설계합니다. XYZ 로봇디자인팀 UX 리드이고, 그 전 3년은 닷에서 촉각 디스플레이 닷패드와 CES 2024 Innovation Award를 받은 닷 캔버스를 맡았습니다.
  - id: grid
    kind: group
    children:
      - { id: deux, kind: entry-card, title: DEUX, index: "01", line: XYZ Inc. · 2026 – 현재, sub: 양팔 휴머노이드 로봇의 표정·소리·목소리와 운영 콘솔 DEUX ON, badge: CASE STUDY, meta: HRI DESIGN · EXPRESSION & SOUND · PRODUCT DESIGN · FRONT-END }
      - { id: barisbrew, kind: entry-card, title: Baris Brew, index: "02", line: XYZ Inc. · 2025 – 현재, sub: 바리스타 로봇 시스템의 고객·운영자 통합 UX, badge: CASE STUDY, meta: SYSTEM UX · VOICE UX · UX DESIGN OPS }
      - { id: dotcanvas, kind: entry-card, title: Dot Pad & Dot Canvas, index: "03", line: Dot Inc. · 2022 – 2025, sub: 촉각 디스플레이와 촉각 그래픽 저작 툴의 UX, badge: CASE STUDY, meta: HARDWARE UX DESIGN · UX RESEARCH · WIREFRAME · GUI DESIGN }
      - { id: storagy, kind: entry-card, title: STORAGY, index: "04", line: XYZ Inc. · 2025 – 현재, sub: 실내 배송 로봇의 비언어적 HRI, badge: CASE STUDY, meta: HRI DESIGN · LED & SOUND FEEDBACK · EXPRESSIVE DISPLAY }
  - { id: footer, kind: site-footer }

layout:
  root: { kind: stack, direction: column, align: stretch, gap: space.lg, padding: space.lg }
  grid: { kind: grid, justify: start, columns: 2, gap: space.lg }

breakpoints:
  mobile:
    - { target: grid, layout: { kind: grid, columns: 1, gap: space.lg } }

flows:
  - { from: deux, to: work-detail, gesture: tap, nav: push }
  - { from: header, via: mark, to: about, gesture: tap, nav: replace }
  - { from: header, via: activity, to: activity-list, gesture: tap, nav: replace }
  - { from: header, via: play, to: play-list, gesture: tap, nav: replace }
  - { from: header, via: blog, to: blog, gesture: tap, nav: replace }

notes:
  - 카드는 샘플 넷이다. 실제는 src/content/works 의 draft 아닌 항목 전부, order 순(지금 9개).
  - 카드 미디어는 루프 영상이 있으면 영상, 없으면 커버 사진(16:9). 여기선 회색 자리로 둔다 — 사이트 파일을 복제하지 않는다.
  - 헤더 메뉴의 흐름은 이 화면에만 적는다. 모든 페이지가 같은 헤더를 쓴다.
  - 영문판(/en/)은 같은 화면, 문구만 다르다 — 화면을 따로 두지 않는다.
